<title>多益衝分站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: answer-sheet metaphor — magenta "printed" structure, graphite pencil marks, left rail on desktop, bottom tabs on phone */
:root {
  --paper: #F3F4EF; --card: #FFFFFF; --ink: #1A1F2C; --muted: #5F6676; --line: #DADDE2;
  --print: #B3306A; --print-soft: #F7E1EB; --graphite: #2A2C31; --on-graphite: #FFFFFF;
  --ok: #1D8455; --ok-soft: #DFF2E8; --bad: #C9501A; --bad-soft: #FBE6DA;
  --hl: rgba(255, 214, 64, .55); --shadow: 0 1px 2px rgba(20,24,35,.06), 0 6px 20px rgba(20,24,35,.06);
  --f-display: "Bricolage Grotesque", "Noto Sans TC", system-ui, sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-en: "Bricolage Grotesque", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121419; --card: #1B1E25; --ink: #E8EAEE; --muted: #9AA1AF; --line: #2D313B;
  --print: #F0709F; --print-soft: #3A1F2D; --graphite: #E8EAEE; --on-graphite: #121419;
  --ok: #4CC38A; --ok-soft: #173427; --bad: #F2905E; --bad-soft: #3A2418;
  --hl: rgba(255, 214, 64, .28); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121419; --card: #1B1E25; --ink: #E8EAEE; --muted: #9AA1AF; --line: #2D313B;
  --print: #F0709F; --print-soft: #3A1F2D; --graphite: #E8EAEE; --on-graphite: #121419;
  --ok: #4CC38A; --ok-soft: #173427; --bad: #F2905E; --bad-soft: #3A2418;
  --hl: rgba(255, 214, 64, .28); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--paper); color: var(--ink); font: 15px/1.65 var(--f-body); -webkit-font-smoothing: antialiased }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--print); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.01em }
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100% }
.rail { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--paper) }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px }
.brand-mark { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--print); display: grid; place-items: center; font: 800 13px var(--f-display); color: var(--print) }
.brand b { font: 800 18px var(--f-display); display: block; line-height: 1.1 }
.brand small { color: var(--muted); font-size: 11px; letter-spacing: .08em }
.nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 0; background: none; text-align: left; color: var(--muted); font-weight: 500 }
.nav:hover { background: var(--card); color: var(--ink) }
.nav[aria-current="page"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow) }
.nav svg { width: 18px; height: 18px; flex: none }
.nav .count { margin-left: auto; font: 700 11px var(--f-mono); background: var(--print); color: #fff; border-radius: 99px; padding: 1px 7px }
.rail-foot { margin-top: auto; padding: 12px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line) }
main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px }
.tabs { display: none }

.eyebrow { font: 700 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--print) }
.muted { color: var(--muted) }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px }
.grid { display: grid; gap: 18px }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
.between { justify-content: space-between }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 18px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 700 }
.btn:hover { filter: brightness(1.12) }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line) }
.btn.ghost:hover { border-color: var(--ink) }
.btn.print { background: var(--print); border-color: var(--print); color: #fff }
.btn.sm { padding: 6px 13px; font-size: 13px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 5px 13px; font-size: 13px; font-weight: 500 }
.chip[aria-pressed="true"] { border-color: var(--print); background: var(--print-soft); color: var(--print) }
.pill { display: inline-block; font: 700 11px var(--f-mono); padding: 2px 8px; border-radius: 99px; background: var(--print-soft); color: var(--print); letter-spacing: .04em }
.pill.ok { background: var(--ok-soft); color: var(--ok) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.hard { background: var(--ink); color: var(--paper) }
.pill.new { background: transparent; border: 1px solid var(--ok); color: var(--ok) }
.cov { display: block; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden }
.cov i { display: block; height: 100%; background: var(--print) }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px }
.scorecard { position: relative; overflow: hidden }
.scorecard::after { content: ""; position: absolute; inset: 0 0 auto auto; width: 160px; height: 160px; background: radial-gradient(circle at 70% 30%, var(--print-soft), transparent 70%); pointer-events: none }
.big { font: 800 64px/1 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px }
.split > div { border-top: 2px solid var(--ink); padding-top: 8px }
.split b { font: 700 26px var(--f-display); font-variant-numeric: tabular-nums }
.gauge { width: 100%; max-width: 280px; display: block; margin: 0 auto }
.plan-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line) }
.plan-item:last-child { border-bottom: 0 }
.tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--print) }
.tick.done { background: var(--graphite); border-color: var(--graphite) }
.skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 28px }
.skill { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 4px 10px; align-items: center; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; border: 0; background: none; text-align: left }
.skill:hover { background: var(--paper) }
.skill .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden }
.skill .bar i { display: block; height: 100% }
.skill .lbl { font-size: 14px; font-weight: 500 }
.skill .val { text-align: right; font: 700 13px var(--f-mono) }
.group-h { grid-column: 1 / -1; font: 700 12px var(--f-mono); color: var(--muted); letter-spacing: .1em; margin-top: 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 64px }
.spark i { flex: 1; background: var(--print); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85 }
.spark i.zero { background: var(--line) }
.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.stat b { display: block; font: 800 28px var(--f-display); font-variant-numeric: tabular-nums }
.stat span { font-size: 12px; color: var(--muted) }
.callout { border: 2px dashed var(--print); border-radius: 16px; padding: 22px; background: var(--print-soft); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center }

/* Mode cards */
.mode { display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 20px }
.mode:hover { border-color: var(--ink) }
.mode h3 { font-size: 19px }
.mode .meta { font: 500 12px var(--f-mono); color: var(--muted) }
.part-tag { font: 800 13px var(--f-mono); color: var(--print) }

/* Quiz */
.qbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding: 10px 0; display: flex; gap: 14px; align-items: center; border-bottom: 1px solid var(--line) }
.progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--print); transition: width .3s }
.qtitle { white-space: nowrap }
.qbar-nav { display: flex; gap: 6px; flex: none }
.progress { min-width: 40px }
@media (max-width: 720px) { .qtitle { display: none } .qbar { gap: 8px } .qbar-nav .btn { padding: 6px 11px } }
.timer { font: 700 15px var(--f-mono); padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--line) }
.timer.warn { border-color: var(--bad); color: var(--bad) }
.qlayout { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 22px; align-items: start }
.qlayout.solo { grid-template-columns: minmax(0, 1fr) }
.set { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start }
.passage { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; font: 16px/1.75 var(--f-en); white-space: pre-wrap; position: sticky; top: 70px; max-height: calc(100vh - 100px); overflow: auto }
.passage .ptitle { font: 700 11px var(--f-mono); letter-spacing: .12em; color: var(--print); text-transform: uppercase; display: block; margin-bottom: 8px; white-space: normal }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 8px; white-space: normal }
.phead .ptitle { margin-bottom: 0 }
.pfold { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 2px 10px; font: 500 12px var(--f-body); color: var(--muted); flex: none }
.phead + * { margin-top: 8px }
.passage .head { display: block; font-weight: 700; margin-bottom: 10px }
.slot { font: 700 13px var(--f-mono); background: var(--hl); padding: 1px 6px; border-radius: 4px; white-space: nowrap }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px }
.qhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.qnum { font: 800 14px var(--f-mono); color: var(--print) }
.stem { font: 500 19px/1.6 var(--f-en); margin: 0 }
.blank { display: inline-block; min-width: 92px; border-bottom: 2px solid var(--ink); text-align: center; background: var(--hl); padding: 0 6px; border-radius: 3px 3px 0 0 }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); font: 16px/1.45 var(--f-en) }
.opt:hover:not(:disabled) { border-color: var(--ink) }
.opt:disabled { cursor: default }
.bubble { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--print); display: grid; place-items: center; font: 700 13px var(--f-mono); color: var(--print); transition: background .15s, color .15s }
.opt.sel .bubble { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite) }
.opt.sel { border-color: var(--graphite) }
.opt.right { border-color: var(--ok); background: var(--ok-soft) }
.opt.right .bubble { background: var(--ok); border-color: var(--ok); color: #fff }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.opt.wrong .bubble { background: var(--bad); border-color: var(--bad); color: #fff }
.opt .mark { font: 700 12px var(--f-mono) }
.opt .hidden-text { color: var(--muted); font: 14px var(--f-body) }
.expl { border-left: 3px solid var(--print); background: var(--paper); border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 14.5px }
.chat { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--paper) }
.chat-log { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; padding: 2px }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px }
.msg.me { align-self: flex-end; background: var(--print); color: #fff; border-bottom-right-radius: 3px }
.msg.ai { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 3px }
.chat-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chat-bar .chip:disabled { opacity: .5; cursor: default }
.chat-clear { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 4px }
.chat-input { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end }
.chat-input textarea { width: 100%; resize: vertical; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink) }
.chat-note { font-size: 12px; min-height: 18px }
.audio { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 12px; background: var(--paper); border: 1px dashed var(--line) }
.play { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--print); color: #fff; display: grid; place-items: center; flex: none }
.play:disabled { background: var(--line); cursor: not-allowed }
.play svg { width: 22px; height: 22px }
.play.on { animation: pulse 1.2s infinite }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px var(--print-soft) } }
@media (prefers-reduced-motion: reduce) { .play.on { animation: none } .progress i { transition: none } }
.sheet { position: sticky; top: 70px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px }
.sheet h3 { font: 700 11px var(--f-mono); letter-spacing: .14em; color: var(--print); margin-bottom: 10px }
.sheet-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
.sheet-grid button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1.5px solid var(--print); background: none; font: 700 11px var(--f-mono); color: var(--print); padding: 0 }
.sheet-grid button.filled { background: var(--graphite); color: var(--on-graphite); border-color: var(--graphite) }
.sheet-grid button.cur { outline: 2px solid var(--print); outline-offset: 2px }
.qnav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap }

/* Results */
.res-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line) }
th { font: 700 11px var(--f-mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase }
.tbl { overflow-x: auto }
details.rev { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 12px 16px }
details.rev summary { cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none }
details.rev summary::-webkit-details-marker { display: none }
details.rev .sum-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-en) }
details.rev[open] .sum-text { white-space: normal }
.rev-body { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 14px }

/* Vocab */
.flash { perspective: 1200px; max-width: 520px; width: 100%; margin: 0 auto }
.flash-in { background: var(--card); border: 1px solid var(--line); border-radius: 18px; min-height: 260px; padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; box-shadow: var(--shadow) }
.flash-word { font: 800 40px var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere }
.flash-ex { font: italic 17px/1.6 var(--f-en); color: var(--muted) }
.boxes { display: flex; gap: 6px; flex-wrap: wrap }
.boxes span { font: 700 12px var(--f-mono); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 10px }
.wordlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px }
.word { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.word b { font: 700 16px var(--f-en) }
.word span { font-size: 13px; color: var(--muted) }

/* Detailed explanation */
.detail { display: flex; flex-direction: column; gap: 14px }
.detail .sec { display: flex; flex-direction: column; gap: 6px }
.lab { font: 700 11px var(--f-mono); letter-spacing: .1em; color: var(--print) }
.en { font: 16px/1.6 var(--f-en) }
.zh { color: var(--muted); font-size: 14px }
.detail blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--hl); background: var(--paper); border-radius: 0 8px 8px 0 }
.orows { display: flex; flex-direction: column; gap: 6px }
.orow { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line) }
.orow.right { border-color: var(--ok); background: var(--ok-soft) }
.orow.wrong { border-color: var(--bad); background: var(--bad-soft) }
.bubble.sm { width: 24px; height: 24px; font-size: 11px; margin-top: 2px }
.orow.right .bubble { background: var(--ok); border-color: var(--ok); color: #fff }
.orow.wrong .bubble { background: var(--bad); border-color: var(--bad); color: #fff }
.why { font-size: 14px; margin-top: 4px }
.words { display: flex; flex-wrap: wrap; gap: 6px }
.wchip { display: inline-flex; gap: 8px; align-items: baseline; border: 1.5px dashed var(--line); background: var(--card); border-radius: 10px; padding: 5px 10px; font-size: 13px; text-align: left }
.wchip b { font: 700 14px var(--f-en) }
.wchip .zh { font-size: 13px }
.wchip .act { font: 700 11px var(--f-mono); color: var(--print) }
.wchip.saved { border-style: solid; border-color: var(--ok) }
.wchip.saved .act { color: var(--ok) }
mark.ev { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px }
.slot.cur { outline: 2px solid var(--print) }
.ptrans { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper) }
.ptrans summary { cursor: pointer; font-weight: 700; color: var(--print) }
.ptrans div { white-space: pre-wrap; margin-top: 8px; font-size: 14.5px; line-height: 1.8 }
.passage.inline { position: static; max-height: none; font-size: 15px; padding: 16px }
.cbar { display: grid; grid-template-columns: 84px minmax(0, 1fr) 24px; gap: 8px; align-items: center; font-size: 13px }
.cbar i { display: block; height: 8px; border-radius: 4px; background: var(--print); min-width: 4px }
.word .ex { font: italic 13px/1.5 var(--f-en) }
/* Spelling practice */
.spell { display: flex; flex-direction: column; gap: 14px; max-width: 680px; width: 100%; margin: 0 auto }
.spell-zh { font-size: 20px; font-weight: 700; line-height: 1.6 }
.spell-en { font: 19px/2.1 var(--f-en) }
.spell-in { font: 600 18px var(--f-en); max-width: 100%; padding: 2px 8px; margin: 0 2px; border: 0; border-bottom: 2px solid var(--print); border-radius: 6px 6px 0 0; background: var(--hl); color: var(--ink); text-align: center }
.spell-in:focus { outline: 2px solid var(--print); outline-offset: 2px }
.spell-in.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok) }
.spell-in.bad { border-color: var(--bad) }
.spell-hint { font: 600 16px var(--f-mono); letter-spacing: .05em; color: var(--print) }
.spell-msg { border-left: 3px solid var(--print); background: var(--paper); border-radius: 0 10px 10px 0; padding: 10px 12px; font-size: 14.5px }
.spell-msg.ok { border-color: var(--ok); color: var(--ok); font-weight: 700 }
.spell-msg.spell, .spell-msg.wrong { border-color: var(--bad) }
.spell-diff { font-size: 20px; letter-spacing: .08em; margin-top: 6px; font-family: var(--f-mono) }
.dok { color: var(--ok) }
.dbad { color: #fff; background: var(--bad); border-radius: 3px; padding: 0 1px }
.today { display: flex; flex-direction: column; gap: 6px; padding: 12px 0 4px; border-bottom: 1px dashed var(--line) }
.base-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 12px }
.base-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted) }

"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 864e5;
const today = () => new Date().toISOString().slice(0, 10);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const LET = "ABCD";

/* ---------- 題庫整理 ---------- */
const Q = {}, SETS = {};
P2.forEach((r, i) => Q["p2-" + i] = { id: "p2-" + i, part: 2, skill: "listen", stem: r[0], opts: r[1], ans: r[2], expl: r[3] });
P5.forEach((r, i) => Q["p5-" + i] = { id: "p5-" + i, part: 5, skill: r[0], stem: r[1], opts: r[2], ans: r[3], expl: r[4] });
P6.forEach((s, i) => {
  const id = "p6-" + i; SETS[id] = { id, part: 6, title: s.title, head: s.head, text: s.text, qids: [] };
  s.qs.forEach((r, k) => { const qid = id + "-" + k; SETS[id].qids.push(qid); Q[qid] = { id: qid, part: 6, set: id, slot: k + 1, skill: r[0], stem: "", opts: r[1], ans: r[2], expl: r[3] }; });

P7.forEach((s, i) => {
  const id = "p7-" + i; SETS[id] = { id, part: 7, title: s.title, text: s.text, qids: [] };
  s.qs.forEach((r, k) => { const qid = id + "-" + k; SETS[id].qids.push(qid); Q[qid] = { id: qid, part: 7, set: id, skill: r[0], stem: r[1], opts: r[2], ans: r[3], expl: r[4] }; });
});
(window.P34 || []).forEach((s, i) => {
  const id = "p34-" + i, who = { W: "Woman", M: "Man", M2: "Man 2", N: "" };
  const label = sp => s.part === 3 && who[sp] ? who[sp] + ": " : "";
  SETS[id] = { id, part: s.part, listen: true, n: i, title: s.title, qids: [],
    text: s.lines.map(l => label(l[0]) + l[1]).join("\n\n"), zh: s.lines.map(l => label(l[0]) + l[2]).join("\n\n") };
  s.qs.forEach((r, k) => { const qid = id + "-" + k; SETS[id].qids.push(qid);
    Q[qid] = { id: qid, part: s.part, set: id, skill: r[0], stem: r[1], opts: r[2], ans: r[3], expl: r[4], zh: r[5], oz: r[6], ev: r[7] }; });
});
// 進階題（bank3.js）標上 hard，介面顯示「進階」
const HD = window.HARD || {};
Object.values(Q).forEach(q => { const m = q.id.match(/^p([567])-(\d+)/); if (m && HD["p" + m[1]] != null && +m[2] >= HD["p" + m[1]]) q.hard = 1; });
const bankCount = () => Object.keys(Q).length;
// 中文翻譯與詳解（zh.js）
(window.ZH5 || []).forEach((z, i) => { const q = Q["p5-" + i]; if (q) { q.zh = z[0]; q.oz = z[1]; q.w = z[2]; } });
(window.ZH2 || []).forEach((z, i) => { const q = Q["p2-" + i]; if (q) { q.zh = z[0]; q.oz = z[1]; } });
(window.ZH6 || []).forEach((z, i) => { const set = SETS["p6-" + i]; if (!set) return; set.zh = z.t; set.w = z.w; z.q.forEach((x, k) => { const q = Q[set.qids[k]]; q.oz = x[0]; q.why = x[1]; }); });
(window.ZH7 || []).forEach((z, i) => { const set = SETS["p7-" + i]; if (!set) return; set.zh = z.t; set.w = z.w; z.q.forEach((x, k) => { const q = Q[set.qids[k]]; q.zh = x[0]; q.oz = x[1]; q.ev = x[2]; }); });

/* ---------- 狀態與儲存 ---------- */
const APP_VERSION = "2026.11.18";
const LSKEY = "toeic-sprint-v1";
const fresh = () => ({ v: 1, goal: 750, pre: null, q: {}, sk: {}, hist: [], daily: {}, vocab: {}, my: {}, ai: [], chat: {}, goalQ: 0, updated: 0 });
let S = fresh();
try { const raw = localStorage.getItem(LSKEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
S.ai.forEach(addAiQ);
// 舊資料沒有記第一次作答，只能猜，標記 fm 後不列入估分
function migrate() {
  Object.values(S.q).forEach(st => { if (st.f == null) { st.f = st.c === st.n ? 1 : 0; st.ft = st.t || 0; st.fm = 1; } });
  if (S.pre && S.pre.lAcc == null) S.pre = null;
}
migrate();
function addAiQ(q) { Q[q.id] = q; }

const cloud = { db: null, uid: null, ref: null, chain: Promise.resolve(), timer: null, status: "local" };
/* ---------- 網站版跨裝置同步（Netlify） ---------- */
// 每台裝置輸入同一組同步碼。每次存檔約 3 秒後，先下載雲端版本合併，再上傳合併結果，
// 這樣兩台裝置各自練習的紀錄都會保留，不會互相蓋掉。
const SYNC_KEY = "toeic-sync-key", SYNC_RE = /^[A-Za-z0-9_-]{20,64}$/;
const sync = { on: !window.claude && /^https?:$/.test(location.protocol), key: null, timer: null, busy: false, again: false, status: "", at: 0 };
try { sync.key = localStorage.getItem(SYNC_KEY); } catch (e) {}
const syncData = () => { const o = Object.assign({}, S); delete o.chat; o.hist = (S.hist || []).slice(-80); return o; };
// a＝這台裝置，b＝雲端。作答紀錄取做得比較多的那份，每日題數取較大值，其他設定取比較新的一方
function mergeState(a, b) {
  const out = Object.assign(fresh(), (b.updated || 0) > (a.updated || 0) ? b : a);
  out.q = Object.assign({}, a.q);
  for (const [id, st] of Object.entries(b.q || {})) { const m = out.q[id]; if (!m || st.n > m.n || (st.n === m.n && (st.t || 0) > (m.t || 0))) out.q[id] = st; }
  out.dd = {}; for (const src of [a.dd || {}, b.dd || {}]) for (const [dv, days] of Object.entries(src)) { const t = out.dd[dv] = out.dd[dv] || {}; for (const [d, n] of Object.entries(days)) t[d] = Math.max(t[d] || 0, n); }
  out.daily = Object.assign({}, a.daily); for (const [d, n] of Object.entries(b.daily || {})) out.daily[d] = Math.max(out.daily[d] || 0, n);
  const sum = {}; Object.values(out.dd).forEach(days => Object.entries(days).forEach(([d, n]) => { sum[d] = (sum[d] || 0) + n; }));
  for (const [d, n] of Object.entries(sum)) out.daily[d] = Math.max(out.daily[d] || 0, n);
  out.vocab = Object.assign({}, a.vocab); for (const [w, v] of Object.entries(b.vocab || {})) { const m = out.vocab[w]; if (!m || (v.due || 0) > (m.due || 0)) out.vocab[w] = v; }
  out.my = Object.assign({}, a.my, b.my);
  const ai = new Map(); [...(a.ai || []), ...(b.ai || [])].forEach(x => ai.set(x.id, x)); out.ai = [...ai.values()].slice(-60);
  const hs = new Map(); [...(a.hist || []), ...(b.hist || [])].forEach(x => hs.set(x.t + ":" + x.kind, x)); out.hist = [...hs.values()].sort((x, y) => x.t - y.t).slice(-80);
  out.chat = a.chat || {};
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  return out;
}
function setSyncStatus(text) {

Write 6 NEW questions: 3 testing "${weak[0]}" and 3 testing "${weak[1]}". Skill codes: pos=part of speech/word form, tense=verb tense, voice=active/passive, agree=subject-verb agreement, verbal=infinitive/gerund/participle, prep=prepositions, conj=conjunctions, pron=pronouns, rel=relative clauses, comp=comparatives, vocab=business vocabulary.
Rules: business/workplace context; one blank written as "-------"; exactly 4 options; exactly one unambiguously correct answer; plausible distractors; do not copy real TOEIC items.
Reply with only a JSON array of objects: {"skill": "<code>", "stem": "...-------...", "options": ["","","",""], "answer": <0-3>, "explanation": "<Traditional Chinese, 1-2 sentences explaining the rule>"}`;
  try {
    let raw;
    try { raw = await sampleFn.json(prompt, { cache: false }); }
    catch (e) { if (e && e.code === "invalid_json" && e.text) raw = looseJson(e.text); else throw e; }
    const ok = normalizeAi(raw, weak[0]);
    if (!ok.length) throw { code: "bad_format" };

    const qs = ok.map((o, i) => Object.assign({ id: "ai-" + t + "-" + i, part: 5, ai: 1 }, o));
    qs.forEach(addAiQ); S.ai = S.ai.concat(qs).slice(-60); save();

  } catch (e) {
    btn.disabled = false;
    const code = e && e.code;
    if (code === "not_granted" || code === "sampling_disabled") { sampleFn = null; st.textContent = "未允許使用 Claude，AI 出題已關閉。"; btn.disabled = true; }
    else st.textContent = { rate_limited: "使用次數太頻繁，請稍後再試。", cancelled: "", session_expired: "登入已過期，請重新登入 Claude 後再試。", refused: "Claude 這次沒有產生題目，請再按一次。", bad_format: "這次產生的題目格式不完整，請再按一次。" }[code]

  }
}
// AI 回覆的格式可能略有差異：容許包在物件裡、答案用字母或字串、空格用底線
function looseJson(text) {
  const m = String(text).match(/[\[{][\s\S]*[\]}]/);
  try { return m ? JSON.parse(m[0]) : null; } catch (e) { return null; }
}
function normalizeAi(raw, fallbackSkill) {
  let arr = raw;
  if (arr && !Array.isArray(arr) && typeof arr === "object") arr = Object.values(arr).find(Array.isArray) || [arr];
  if (!Array.isArray(arr)) return [];
  return arr.map(o => {
    if (!o || typeof o !== "object") return null;
    const opts = o.options || o.choices || o.opts;
    let stem = String(o.stem || o.question || o.sentence || "");
    if (!Array.isArray(opts) || opts.length !== 4) return null;
    stem = stem.replace(/-{3,}|_{3,}|\(\s*\)|\[\s*\]/, "-------");
    if (!stem.includes("-------")) return null;
    let ans = o.answer ?? o.answerIndex ?? o.correct;
    if (typeof ans === "string") {
      const s = ans.trim();
      ans = /^[A-Da-d]$/.test(s) ? "ABCD".indexOf(s.toUpperCase()) : /^\d$/.test(s) ? +s : opts.map(String).indexOf(s);
    }
    if (!Number.isInteger(ans) || ans < 0 || ans > 3) return null;
    return { skill: SKILLS[o.skill] && SKILLS[o.skill].group === "G" ? o.skill : fallbackSkill, stem, opts: opts.map(String), ans, expl: String(o.explanation || o.explain || "") };
  }).filter(Boolean);
}

/* ---------- 拼字練習：看中文句意，把單字填進英文句子 ---------- */
const spNorm = s => String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, " ").trim();
const spLemma = s => spNorm(s).replace(/ies$/, "y").replace(/(es|s|ed|ing|ly)$/, "").replace(/e$/, "");
const spEscRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  const stem = !word.includes(" ") && word.length > 5 && /[ey]$/.test(word) ? word.slice(0, -1) : word;
  const m = sentence.match(new RegExp("\\b" + spEscRe(stem) + (word.includes(" ") ? "" : "[a-z]*"), "i"));
  return m ? { form: m[0], at: m.index } : null;
}
function spItem(w) {
  const i = VOCAB.findIndex(v => v[0] === w[0]);
  const it = { key: w[0], word: w[0], mean: w[2], i, syn: [], ex: null, zh: "", form: w[0], at: -1 };
  if (i >= 0 && window.VEX && VEX[i]) { it.ex = VOCAB[i][3]; it.zh = VEX[i][0]; it.syn = VEX[i][1]; }
  else {
    // 生字簿裡的字：從題庫找一個有中文翻譯、含這個字的句子
    for (const id of Object.keys(Q)) {
      const q = Q[id];
      if (q.part !== 5 || !q.zh) continue;
      const s = q.stem.replace(/-{5,}/, q.opts[q.ans]);
      if (spFindForm(w[0], s)) { it.ex = s; it.zh = q.zh; break; }
    }
  }
  const f = spFindForm(w[0], it.ex);
  if (f) { it.form = f.form; it.at = f.at; } else it.ex = null;
  return it;
}
// 用編輯距離對齊，標出輸入裡拼錯、多打和漏打的位置
function spDiff(a, t) {
  const n = a.length, m = t.length, d = [...Array(n + 1)].map(() => Array(m + 1).fill(0));
  for (let x = 0; x <= n; x++) d[x][0] = x;
  for (let y = 0; y <= m; y++) d[0][y] = y;
  for (let x = 1; x <= n; x++) for (let y = 1; y <= m; y++)
    d[x][y] = Math.min(d[x - 1][y] + 1, d[x][y - 1] + 1, d[x - 1][y - 1] + (a[x - 1] === t[y - 1] ? 0 : 1));
  const out = []; let x = n, y = m;
  while (x > 0 || y > 0) {
    if (x > 0 && y > 0 && d[x][y] === d[x - 1][y - 1] + (a[x - 1] === t[y - 1] ? 0 : 1)) { out.unshift([a[x - 1], a[x - 1] === t[y - 1]]); x--; y--; }
    else if (x > 0 && d[x][y] === d[x - 1][y] + 1) { out.unshift([a[x - 1], false]); x--; }
    else { out.unshift(["‸", false]); y--; }
  }
  return { dist: d[n][m], html: out.map(([c, ok]) => `<span class="${ok ? "dok" : "dbad"}">${esc(c === " " ? "␣" : c)}</span>`).join("") };
}
let sp = null;
function spStart() {

}
function spNext() {

}

}

    <div class="row between"><span class="muted num" style="font-size:12px">剩 ${left} 個${it.retry ? " · 重做" : S.vocab[it.key] ? " · 複習" : " · 新字"}${S.my[it.key] ? " · 我的生字簿" : ""}</span><span class="muted" style="font-size:12px">一次拼對 ${sp.clean}</span></div>

    ${c.msg ? `<div class="spell-msg ${c.kind}">${esc(c.msg)}${c.diff ? `<div class="spell-diff num">${c.diff}</div>` : ""}</div>` : ""}
    <div class="row">${c.done
      ? `<button class="btn print" type="submit">下一個 <span class="kbd">Enter</span></button>${it.ex ? `<button class="btn ghost sm" type="button" data-say="${esc(it.ex)}">再聽一次例句</button>` : ""}`

  if (d.chatopen) {
    chatOpen[d.chatopen] = true;
    const tmp = document.createElement("div"); tmp.innerHTML = chatHtml(Q[d.chatopen]); t.replaceWith(tmp.firstElementChild);
    const box = document.getElementById("chatinput-" + d.chatopen); if (box) box.focus({ preventScroll: true });
    return;
  }
  if (d.syncnew != null) { setSyncKey(newSyncKey()); render(); syncNow(); return toast("已建立同步碼，請在其他裝置輸入同一組碼"); }
  if (d.syncuse != null) {
    const k = $("#sync-input").value.trim().replace(/\s+/g, "");
    if (!SYNC_RE.test(k)) { $("#sync-note").textContent = "同步碼格式不對，請確認有完整複製（例如 abcd-EFGH-…，共 29 個字元）。"; return; }
    setSyncKey(k); render(); syncNow(); return toast("已開啟同步，正在合併兩邊的進度");
  }
  if (d.synccopy != null) { try { navigator.clipboard.writeText(sync.key).then(() => toast("已複製同步碼"), () => toast("請手動選取同步碼複製")); } catch (e) { toast("請手動選取同步碼複製"); } return; }
  if (d.syncnow != null) return syncNow();
  if (d.syncoff != null) { setSyncKey(null); sync.status = ""; render(); return toast("這台裝置已停止同步，進度仍保留在這台裝置"); }
  if (d.export != null) return exportCode(t);
  if (d.download != null) return downloadBackup();
  if (d.import != null) return importProgress();
  if (d.chatask) return chatSend(d.chatask, d.text);
  if (d.chatclear) { delete S.chat[d.chatclear]; save(); return chatRefresh(Q[d.chatclear]); }
  if (d.chatsend) {
    const run = chatRun[d.chatsend];
    if (run) return run.ctl.abort();
    return chatSend(d.chatsend, document.getElementById("chatinput-" + d.chatsend).value);
  }
  if (d.start) return startSession(builders[d.start]());
  if (d.part) return startSession(builders.part(+d.part, +d.n));
  if (d.skill) return startSession(builders.skill(d.skill));
  if (d.goal) { S.goal = +d.goal; save(); return render(); }
  if (d.review) { const ids = d.review === "due" ? dueReviews() : [...document.querySelectorAll("details.rev[data-id]")].map(el => el.dataset.id); if (ids.length) startSession(builders.review(ids)); return; }
  if (d.rfilter) { rf.part = d.rfilter; return render(); }
  if (d.addword) {
    const w = d.addword;
    if (S.my[w]) delete S.my[w]; else S.my[w] = d.zh;
    save();
    document.querySelectorAll(`[data-addword="${CSS.escape(w)}"]`).forEach(b => { b.classList.toggle("saved", !!S.my[w]); b.querySelector(".act").textContent = S.my[w] ? "✓ 已收藏" : "＋ 生字簿"; });
    return toast(S.my[w] ? `已把 ${w} 加入生字簿` : `已把 ${w} 移出生字簿`);
  }
  if (d.cause) {
    const st = S.q[d.cause]; if (!st) return;
    st.why = st.why === d.c ? undefined : d.c; save();
    t.parentElement.querySelectorAll("[data-cause]").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === st.why));
    return;
  }
  if (d.master) { if (S.q[d.master]) delete S.q[d.master].rv; save(); toast("已移出錯題本"); return render(); }
  if (d.vmode) { vmode = d.vmode; return render(); }
  if (d.sphint != null && sp && sp.cur) { sp.cur.hint = Math.min(3, sp.cur.hint + 1); sp.cur.input = $("#spell-in").value; return render(); }
  if (d.spagain != null) { if (!vocabQueue().length) vq = null; spStart(); return render(); }
  if (d.delword) { delete S.my[d.delword]; save(); return render(); }
  if (t.id === "ai-gen") return aiGenerate();
  if (d.vflip != null) { vflip = true; return render(); }
  if (d.vans) return vocabAnswer(d.vans === "1");
  if (d.vmore != null) { vq = vocabNew().slice(0, 10); return render(); }
  if (d.say) return sayWord(d.say);
  if (!session) return;
  if (d.q) return choose(d.q, +d.o);
  if (d.play) return playP2(Q[d.play]);
  if (d.showtext != null) { session.showText = true; return render(); }
  if (d.pfold != null) { session.fold = !session.fold; const y = window.scrollY; render(); return window.scrollTo(0, y); }
  if (d.next != null) { stopSpeech(); session.idx++; window.scrollTo(0, 0); return render(); }
  if (d.prev != null) { stopSpeech(); session.idx--; window.scrollTo(0, 0); return render(); }
  if (d.jump) { stopSpeech(); session.idx = +d.jump; return render(); }
  if (d.finish != null) return finish();
  if (d.finishyes != null) return finish(true);
  if (d.finishno != null) { session.confirmFinish = false; return render(); }
  if (d.quit != null) { session.confirmQuit = true; return render(); }
  if (d.quitno != null) { session.confirmQuit = false; return render(); }
  if (d.quityes != null) { if (!session.done && session.mode === "practice" && Object.keys(session.ans).length) { const ids = allQids(), c = ids.filter(id => session.ans[id] === Q[id].ans).length; S.hist.push({ t: Date.now(), kind: session.kind, title: session.title, n: Object.keys(session.ans).length, c }); save(); } return go(current); }
});
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.chatinput) chatDraft[e.target.dataset.chatinput] = e.target.value; });
document.addEventListener("keydown", e => {
  if (e.target.dataset && e.target.dataset.chatinput) {
    // 注音或拼音選字時的 Enter 不能送出
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); chatSend(e.target.dataset.chatinput, e.target.value); }
    return;
  }
  if (e.target.closest("input,select,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!session && current === "vocab" && vq && vq.length && vmode === "cards") {
    if (e.key === " " && !vflip) { e.preventDefault(); vflip = true; render(); }
    else if (vflip && (e.key === "1" || e.key === "2")) vocabAnswer(e.key === "2");
    return;
  }
  if (!session || session.done) return;
  const page = session.pages[session.idx];
  const k = e.key.toUpperCase(), i = LET.indexOf(k);
  if (i >= 0 && k.length === 1) {
    const qid = page.qids.find(id => session.ans[id] == null) || (session.mode === "test" || !revealed(page.qids[0]) ? page.qids[page.qids.length - 1] : null);
    if (qid && i < Q[qid].opts.length) choose(qid, session.perm[qid][i]);
  } else if (e.key === "Enter") {
    const b = $("[data-next]:not(:disabled)") || $("[data-finish]:not(:disabled)"); if (b && session.mode === "practice") b.click();
  }
});
window.addEventListener("hashchange", () => { if (!session) route(); });
document.addEventListener("change", e => {
  if (e.target.id === "import-file" && e.target.files[0]) {
    const f = e.target.files[0]; importArmed = false;
    f.text().then(txt => { $("#import-box").value = txt.length > 2000 ? "（已讀取備份檔 " + f.name + "）" : txt; return importProgress(txt); });
    return;
  }
  if (e.target.id === "rf-skill") { rf.skill = e.target.value; render(); }
  if (e.target.id === "rf-cause") { rf.cause = e.target.value; render(); }
});
if (tts.speech) speechSynthesis.onvoiceschanged = () => {};
route();
initCloud();
if (sync.on && sync.key) syncNow();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
window.addEventListener("online", () => syncNow());
initSample();
initDownloads();
</script>
